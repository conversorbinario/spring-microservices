version: '3'

services:
  java_app:
    container_name: java_app
    build: .
    ports:
      - "${FREE_LOCAL_PORT2}:8080"
    environment:
      - spring.datasource.url=jdbc:mysql://mysql:3306/mydatabase?allowPublicKeyRetrieval=true&useSSL=false&createDatabaseIfNotExist=true
      #-  spring.datasource.url="jdbc:mysql://mysqldb:${FREE_LOCAL_PORT1}/basics?allowPublicKeyRetrieval=true"
      -  spring.jpa.hibernate.ddl-auto=update
      -  spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
      #- 'DATABASE_URL=jdbc:mysql://mysql:3306/mydatabase'
      - spring.datasource.username=${DB_USER}
      - spring.datasource.password=${DB_USER_PASSWORD}
    volumes:
      # Mount el directorio actual en /app en el container
      - .:/app
    working_dir: /app
    depends_on:
      - mysql
    command: >
      sh -c "./gradlew build && java -jar build/libs/microservices-0.0.1-SNAPSHOT.jar"
  mysql:
    container_name: mysql-container
    image: 'mysql:8.0'
    environment:
      - "MYSQL_DATABASE=${DB_NAME}"
      - "MYSQL_USER=${DB_USER}"
      - "MYSQL_PASSWORD=${DB_USER_PASSWORD}"
      - "MYSQL_ROOT_PASSWORD=${DB_ROOT_PASSWORD}"
    ports:
      - "${FREE_LOCAL_PORT1}:3306"